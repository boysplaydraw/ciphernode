name: iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build IPA
        run: eas build --platform ios --profile production --non-interactive --json > eas-ios.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download IPA from EAS
        run: node scripts/ci/download-eas-artifact.mjs eas-ios.json CipherNode.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ciphernode-ipa
          path: CipherNode.ipa
          if-no-files-found: error

      - name: Upload to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "${GITHUB_REF_NAME}" CipherNode.ipa --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
