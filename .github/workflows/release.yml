name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, for example v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: 20
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: npm run check:types

      - name: EAS Build production APK
        run: eas build --platform android --profile production --non-interactive --json > eas-android.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: node scripts/ci/download-eas-artifact.mjs eas-android.json CipherNode.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ciphernode-android
          path: CipherNode.apk
          if-no-files-found: error

  tauri-windows:
    name: Tauri Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go/go.mod

      - name: Build Go backend (Windows x64)
        run: go build -trimpath -ldflags="-s -w" -o src-tauri/binaries/ciphernode-backend-x86_64-pc-windows-msvc.exe ./server/go/cmd/ciphernode-server
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run check:types

      - name: Export web app
        run: npx expo export --platform web --output-dir dist
        env:
          NODE_ENV: production
          CI: '1'

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: ciphernode-tauri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  tauri-linux:
    name: Tauri Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go/go.mod

      - name: Build Go backend (Linux x64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o src-tauri/binaries/ciphernode-backend-x86_64-unknown-linux-gnu ./server/go/cmd/ciphernode-server

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run check:types

      - name: Export web app
        run: npx expo export --platform web --output-dir dist
        env:
          NODE_ENV: production
          CI: '1'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: ciphernode-tauri-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

  tauri-macos:
    name: Tauri macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go/go.mod

      - name: Build Go backend (macOS Universal)
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o src-tauri/binaries/ciphernode-backend-aarch64-apple-darwin ./server/go/cmd/ciphernode-server
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o src-tauri/binaries/ciphernode-backend-x86_64-apple-darwin ./server/go/cmd/ciphernode-server

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run check:types

      - name: Export web app
        run: npx expo export --platform web --output-dir dist
        env:
          NODE_ENV: production
          CI: '1'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Tauri (Universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: ciphernode-tauri-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn

  docker:
    name: Docker Multi-Arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push default image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mero003/ciphernode:latest
            mero003/ciphernode:${{ env.RELEASE_VERSION }}

      - name: Build and push all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.allinone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mero003/ciphernode:all-in-one
            mero003/ciphernode:all-in-one-${{ env.RELEASE_VERSION }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android
      - tauri-windows
      - tauri-linux
      - tauri-macos
      - docker
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: CipherNode ${{ env.RELEASE_VERSION }}
          files: release-artifacts/**
          body: |
            CipherNode release ${{ env.RELEASE_VERSION }}.

            Docker images:
            - mero003/ciphernode:latest
            - mero003/ciphernode:${{ env.RELEASE_VERSION }}
            - mero003/ciphernode:all-in-one
            - mero003/ciphernode:all-in-one-${{ env.RELEASE_VERSION }}
