services:
  ciphernode-relay:
    image: mero003/ciphernode:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ciphernode-relay
    restart: unless-stopped

    ports:
      - "${PORT:-5000}:5000"

    env_file:
      - path: .env
        required: false

    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-120}"
      MESSAGE_TTL: "${MESSAGE_TTL:-24h}"
      FILE_TTL: "${FILE_TTL:-24h}"
      REPLAY_TTL: "${REPLAY_TTL:-1h}"
      TIMESTAMP_SKEW: "${TIMESTAMP_SKEW:-5m}"
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-100}"
      MAX_FILE_DOWNLOADS: "${MAX_FILE_DOWNLOADS:-10}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      ONION_ADDRESS: "${ONION_ADDRESS:-}"

    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    tmpfs:
      - /tmp:size=100M,mode=1777

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    labels:
      - "org.opencontainers.image.title=CipherNode"
      - "org.opencontainers.image.source=https://github.com/boysplaydraw/ciphernode"
